<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcana Mystica — 타로 점</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="starsLayer"></div>
<div id="bgSyms"></div>

<div id="tarotApp">

  <!-- SCREEN 1: 인트로 -->
  <div class="tarot-screen tarot-active" id="screen1">
    <svg class="occult-ring" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="rg1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="110" cy="110" r="100" fill="url(#rg1)" stroke="#c9a84c" stroke-width="1.2"/>
      <circle cx="110" cy="110" r="85" fill="none" stroke="#b8860b" stroke-width="0.7" stroke-dasharray="4 3"/>
      <circle cx="110" cy="110" r="70" fill="none" stroke="#c9a84c" stroke-width="0.8"/>
      <polygon points="110,30 126,58 158,58 134,76 144,106 110,88 76,106 86,76 62,58 94,58" fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.7"/>
      <g font-size="11" fill="#c9a84c" font-family="serif" text-anchor="middle">
        <text x="110" y="18">☽</text><text x="186" y="60">✦</text>
        <text x="202" y="118">⊕</text><text x="186" y="175">✧</text>
        <text x="110" y="208">☾</text><text x="34" y="175">✦</text>
        <text x="18" y="118">⊕</text><text x="34" y="60">✧</text>
      </g>
      <ellipse cx="110" cy="110" rx="20" ry="12" fill="none" stroke="#c9a84c" stroke-width="1.2"/>
      <circle cx="110" cy="110" r="6" fill="#c9a84c" opacity="0.8"/>
      <circle cx="110" cy="110" r="3" fill="#0a0612"/>
      <polygon points="110,68 138,118 82,118" fill="none" stroke="#b8860b" stroke-width="0.8" opacity="0.5"/>
      <polygon points="110,152 82,102 138,102" fill="none" stroke="#b8860b" stroke-width="0.8" opacity="0.5"/>
    </svg>
    <h1 class="tarot-title">Arcana Mystica</h1>
    <div class="tarot-divider"></div>
    <p class="tarot-subtitle">운명의 카드가 당신을 기다립니다 ✨</p>
    <p class="tarot-subtitle tarot-sub2">THE ANCIENT CARDS HOLD YOUR SECRETS</p>
    <div class="tarot-divider-dbl"><span></span><span></span></div>
    <p class="tarot-guide">세 장의 카드가 과거 · 현재 · 미래를 말해줍니다</p>
    <div class="tarot-btns">
      <button class="tarot-btn tarot-btn-gold" id="btnStart">✦ 점술을 시작하다 ✦</button>
    </div>
  </div>

  <!-- SCREEN 2: 카드 선택 -->
  <div class="tarot-screen" id="screen2">
    <h2 class="tarot-h2">🃏 카드를 선택하세요</h2>
    <div class="tarot-divider"></div>
    <div class="pick-status" id="pickStatus">
      <span class="pick-dot" id="dot1"></span>
      <span class="pick-label" id="pickLabel">첫 번째 카드를 고르세요 — 과거</span>
      <span class="pick-dot" id="dot2"></span>
      <span class="pick-dot" id="dot3"></span>
    </div>
    <p class="tarot-guide">고요히 마음을 가라앉히고 — 당신의 손길이 닿는 카드가 운명입니다</p>
    <div id="cardsGrid"></div>
    <div class="tarot-btns">
      <button class="tarot-btn tarot-btn-white tarot-btn-sm" id="btnBack2">← 처음으로</button>
      <button class="tarot-btn tarot-btn-white tarot-btn-sm" id="btnReshuffle">🔀 다시 섞기</button>
    </div>
  </div>

  <!-- SCREEN 3: 결과 -->
  <div class="tarot-screen" id="screen3">
    <h2 class="tarot-h2">🌟 당신의 운세</h2>
    <div class="tarot-divider"></div>
    <div id="threeResults"></div>
    <div class="tarot-btns">
      <button class="tarot-btn tarot-btn-gold tarot-btn-sm" id="btnAgain">✦ 다시 뽑기</button>
      <button class="tarot-btn tarot-btn-white tarot-btn-sm" id="btnBack3">← 처음으로</button>
    </div>
  </div>

</div>
  
  <!-- 푸터 -->
  <footer style="
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 16px 20px 32px;
    font-size: 0.82rem;
    color: #B8A9C0;
    letter-spacing: 0.5px;
  ">
    made with ❤️ by mihwa<br/>
    good luck to you!
  </footer>
  
<script src="script.js"></script>
</body>
</html>
